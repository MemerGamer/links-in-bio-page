<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kovács Bálint Hunor - Links</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Kovács Bálint Hunor's links site." />
    <!-- Chromium: first paint waits for #content-end, so the page appears whole instead of row by row. -->
    <link rel="expect" href="#content-end" blocking="render" />
    <style>
      *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
      html {
        /* Same colour as the birds' clear colour, so they appear without a jump. */
        background: #a395e9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body { min-height: 100vh; color: #fff; background: transparent; }
      h1 { font: inherit; }
      a { color: inherit; text-decoration: inherit; }
      ul { list-style: none; }

      #vanta { position: fixed; top: 0; left: 0; z-index: 0; width: 100%; height: 100%; background: transparent; }
      .vanta-canvas { animation: birds-in 0.8s ease-out; }
      @keyframes birds-in { from { opacity: 0; } }
      main { position: relative; }

      .avatar, .handle, li {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .handle, li {
        border-radius: 9999px;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      }

      header { display: flex; flex-direction: column; align-items: center; gap: 1rem; margin: 3rem 0 1.5rem; text-align: center; }
      .avatar {
        width: 8rem;
        height: 8rem;
        overflow: hidden;
        border: 2px solid rgb(255 255 255 / 0.8);
        border-radius: 50%;
        box-shadow: 0 8px 32px rgb(0 0 0 / 0.3), 0 0 0 1px rgb(255 255 255 / 0.1);
      }
      .avatar img { display: block; position: relative; bottom: 10px; max-width: 100%; height: auto; }
      .handle {
        padding: 1rem 2rem;
        border: 1px solid rgb(255 255 255 / 0.3);
        background: linear-gradient(to right, rgb(0 0 0 / 0.2), rgb(0 0 0 / 0.1));
        font-size: 1.25rem;
        line-height: 1.75rem;
        font-weight: 700;
        /* Own layer: without it, GPU raster under SwiftShader drew this translucent gradient over white. */
        will-change: transform;
      }

      ul { max-width: 32rem; margin: 0 auto; padding: 1.5rem 1rem; }
      li { padding: 0.75rem; border: 1px solid rgb(255 255 255 / 0.2); background: rgb(255 255 255 / 0.95); }
      li + li { margin-top: 1rem; }
      li a {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 0;
        color: #1e2939;
        font-weight: 500;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* Same spot as the Font Awesome glyphs: 1em tall, at the top of a 1.25rem box. */
      li svg { flex: none; width: 1.25rem; height: 1.25rem; padding-bottom: 0.25rem; fill: currentColor; }
      .blue-600 { color: #155dfc; }
      .blue-500 { color: #2b7fff; }
      .gray-800 { color: #1e2939; }
      .gray-700 { color: #364153; }
      .orange-600 { color: #f54900; }
      .green-600 { color: #00a63e; }
      @supports (color: oklch(0 0 0)) {
        li a, .gray-800 { color: oklch(27.8% 0.033 256.848); }
        .blue-600 { color: oklch(54.6% 0.245 262.881); }
        .blue-500 { color: oklch(62.3% 0.214 259.815); }
        .gray-700 { color: oklch(37.3% 0.034 259.733); }
        .orange-600 { color: oklch(64.6% 0.222 41.116); }
        .green-600 { color: oklch(62.7% 0.194 149.214); }
      }

      @media (hover: hover) {
        .avatar:hover, .handle:hover { scale: 1.05; }
        .handle:hover, li:hover { box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
        li:hover { scale: 1.05; translate: 0 -0.25rem; }
        li a:hover { color: #000; text-decoration: underline; }
      }
      @media (min-width: 40rem) {
        ul { padding-inline: 1.5rem; }
        li + li { margin-top: 1.25rem; }
      }
    </style>
  </head>

      // The birds are decoration, so nothing above waits for them. Skipped inside

      // the static background from the html rule stays in those cases and if a CDN fails.
      (function () {
        var connection = navigator.connection;
        if (
          window.top !== window.self ||
          matchMedia("(prefers-reduced-motion: reduce)").matches ||
          (connection && connection.saveData)
        ) {
          return;

        function loadScript(src, integrity, onload) {
          var script = document.createElement("script");
          script.src = src;
          script.integrity = integrity;
          script.crossOrigin = "anonymous";
          script.onload = onload;
          document.head.appendChild(script);
        }

        function startBirds() {
          loadScript(
            "https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js",
            "sha384-9EQoUIJYrv09/oYhSxnw1VpLcfPw3BM9dE7+D/3wGUPeLLa7F9Z6OAoD+i/M6FK9",
            function () {
              loadScript(
                "https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.birds.min.js",
                "sha384-gtCrx5xYOCU4ERCq2lWuiKQ0qCso/rtpn+d+hpx5xcqtw9KKyBkWgz37V8lc3/oT",

                    gyroControls: false,
                    minHeight: 200.0,
                    minWidth: 200.0,
                    scale: 1.0,
                    scaleMobile: 1.0,
                    backgroundColor: 0xa395e9,
                    color1: 0x0,
                    color2: 0x0,
                    alignment: 77.0,
                    quantity: 2.0,
                  });
                }
              );
            }
          );
        }

        // rAF + timeout lands after the first frame; then wait for an idle moment.
        function afterFirstPaint() {
          requestAnimationFrame(function () {
            setTimeout(function () {
              if (window.requestIdleCallback) {
                requestIdleCallback(startBirds, { timeout: 2000 });
              } else {
                setTimeout(startBirds, 200);
              }
            }, 0);
          });
        }

        if (document.readyState === "complete") {
          afterFirstPaint();
        } else {
          window.addEventListener("load", afterFirstPaint);
        }
